[APPUSAGE]
APPUSAGE=ON
# predefined ENTRY_SMART favorite lists
# First Favorite Format: PREDEFINE_FAV_ONE=YOUR_FAVORITE_APP
# Second Favorite Format: PREDEFINE_FAV_SECOND=YOUR_FAVORITE_APP
PREDEFINE_FAV_ONE=com.samsung.tv.csfs
PREDEFINE_FAV_SECOND=org.tizen.netflix-app
PREDEFINE_FAV_THIRD=org.tizen.primevideo
PREDEFINE_FAV_THIRD=com.samsung.tv.cobalt-yt
PREDEFINE_FAV_THIRD=HEPsqFNie0.tvplusstandalone

[APPUSAGE_VCONF]
APPUSAGE_VCONF=ON
# predefined favorite app vconf list
# Format : VCONF=YOUR_FAVORITE_APP_VCONF
PREDEFINE_VCONF=db/appfw/home_appid

[ACTIVE_BG]
ACTIVE_BG=ON
# Predefind active BG app list
# Avoid killing app in Background State
APP=com.samsung.tv.voiceassistant-music
APP=com.samsung.tv.bmp
APP=org.tizen.graphiczoom
