[POPUP]
oom_popup=no

[BackgroundReclaim]
# Unset this option if it causes any unexepcted issue (e.g. jerky animation).
AfterScreenDim=yes

[Compaction]
CompactEnable=0
# External fragmentation level
# The higher the level the less restrictive
# conditions for triggering compaction.
Fraglevel=800

[MemLimit]
# Control memory limit
# values for MemLimitTrigger :
#		oom (regiter event using oom_control and kill process in kernel)
#	        threshold(regiter event using usage_in_bytes and kill process in resourced)
#		others(don't register any event for memory limit)
MemLimitTrigger=none
# How long does the resourced allow that each service applications use memory
# But, it only allows to enable when the MemLimitTrigger option is oom or threshold.
MemLimitService=100		# MB

[PSI-KILLING]
#when to Register for PSI killing events(in sec)
startPSIKillAt=250
#Percentage value of PSI Trigger
psiTriggerPercent=55
#PSI window size in MSEC
psiWindowSize=2000000
#Thrashing related Thresholds
thrashingLimitPCT=70
thrashingCriticalPCT=110
#Time difference from last killing in seconds to check cyclic killing
lastKillDiffPSI=10
#SwapFree checking as Percent value of SwapTotal
swapFreeLowPercentage=10
#memFree related Thresholds
wmark_min=30
wmark_low=35
wmark_high=40
#Filecache size in KB
#File cache is too low after thrashing, keep killing background processes
filecache_min_kb=153600
