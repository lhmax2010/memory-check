[Memory64]
# Threshold to start swap
ThresholdSwap=15		# MB

# Threshold to start reclaim
ThresholdLow=8			# MB

# Threshold to start low memory killer
ThresholdMedium=5		# MB

# Threshold to stop low memory killer
ThresholdLeave=8		# MB

# Threshold to stop signal loader process and stop csfs extramem_allocation
ThresholdExtraMemFree=200              # MB

# Threshold to start extramem allocation
ThresholdExtraMemAlloc=350              # MB

# Number of max victims
NumMaxVictims=1

